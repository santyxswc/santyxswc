name: Tarjetas del perfil

on:
  push:
    branches: [main]
    paths: [".github/workflows/perfil.yml", "scripts/actividad.py", "scripts/terminal.py"]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Lee también los repos privados, por eso usa un token propio de sólo lectura
  # (secret ACTIVIDAD_TOKEN) en vez del GITHUB_TOKEN, que sólo ve este repo.
  actividad:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.ACTIVIDAD_TOKEN }}
    steps:
      - name: Revisar el token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Falta el secret ACTIVIDAD_TOKEN"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Usar el token para clonar
        run: gh auth setup-git
      - name: Generar la tarjeta
        run: |
          python3 scripts/actividad.py
          mkdir -p dist
          cp assets/actividad-*.svg assets/calendario-*.svg dist/
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: actividad
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  serpiente:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
